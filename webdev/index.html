<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle Rental Platform</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; }
    header { background: #333; color: white; padding: 15px; text-align: center; }
    nav { display: flex; justify-content: center; gap: 20px; background: #555; padding: 10px; }
    nav a { color: white; text-decoration: none; }
    .container { padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
    .card { border: 1px solid #ccc; padding: 15px; border-radius: 10px; }
    .btn { background: #333; color: white; padding: 10px; border: none; cursor: pointer; }
    input, select { padding: 8px; margin: 5px 0; width: 100%; }
  </style>
</head>
<body>

<header>
  <h1>Vehicle Rental System</h1>
</header>

<nav>
  <a href="#home">Home</a>
  <a href="#browse">Browse Vehicles</a>
  <a href="#dashboard">Dashboard</a>
</nav>

<div class="container" id="home">
  <h2>User Login / Register</h2>
  <input type="text" placeholder="Username">
  <input type="password" placeholder="Password">
  <button class="btn">Login</button>
</div>

<div class="container" id="browse">
  <h2>Browse Vehicles</h2>

  <h3>Filters</h3>
  <select>
    <option>Vehicle Type</option>
    <option>2 Wheeler</option>
    <option>4 Wheeler</option>
  </select>

  <select>
    <option>Fuel Type</option>
    <option>Petrol</option>
    <option>Diesel</option>
    <option>Electric</option>
  </select>

  <input type="number" placeholder="Max Price">

  <div class="grid">
    <div class="card">
      <h3>Bike - Honda</h3>
      <p>₹500/day</p>
      <button class="btn">Book</button>
    </div>

    <div class="card">
      <h3>Car - Hyundai</h3>
      <p>₹1500/day</p>
      <button class="btn">Book</button>
    </div>
  </div>
</div>

<div class="container" id="dashboard">
  <h2>Owner Dashboard</h2>

  <h3>Add Vehicle</h3>
  <input type="text" placeholder="Vehicle Number">
  <input type="text" placeholder="Model & Brand">
  <input type="number" placeholder="Price per day">
  <button class="btn">Add Vehicle</button>

  <h3>Manage Bookings</h3>
  <div class="card">
    <p>Booking #1 - Pending</p>
    <button class="btn">Approve</button>
    <button class="btn">Reject</button>
  </div>
</div>

</body>
</html>
